<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemonade Stand</title><meta name="description" content="A playable little 2D lemonade business."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='13' ry='10' fill='%23f9ce43'/%3E%3Cpath d='M18 7Q21 0 29 4Q26 11 18 7' fill='%234b8c50'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="https://qetuop-mini-arcade.yuanz1.chatgpt.site/games/lemonade-stand/" aria-label="Back to Mini Arcade">← Arcade</a><h1>Lemonade Stand</h1><button id="sound" aria-label="Enable sound" aria-pressed="false">Sound off</button></header>
<section class="game" aria-label="Lemonade Stand game"><div class="hud"><span>DAY <b id="day">1</b></span><span>CASH <b id="cash">$20.00</b></span><span>CUPS <b id="cups">0</b></span><span id="weather">☀ 78°F</span><span id="clock">00:75</span></div>
<canvas id="scene" tabindex="0" width="960" height="600" aria-label="Street scene with a lemonade stand and customers">Your browser needs Canvas support.</canvas>
<div id="banner" class="banner" aria-live="polite">Ready for a sunny day?</div>
<div id="overlay" class="overlay"><form id="setup" class="panel"><h2>Day <span id="setup-day">1</span></h2><div class="forecast" id="forecast"></div><div id="supplies" class="supplies"></div><div class="recipe"><label>Lemons / cup<input id="lemons" type="number" min="1" max="3" value="1" required></label><label>Sugar / cup<input id="sugar" type="number" min="1" max="3" value="1" required></label><label>Ice / cup<input id="ice" type="number" min="1" max="3" value="1" required></label></div><div class="purchase"><label>Price / cup ($)<input id="price" type="number" min="0.25" max="5" step="0.05" value="1.50" required></label><div>Supplies cost<strong id="cost">$9.00</strong></div></div><p id="error" role="alert"></p><button class="primary" type="submit">Open stand</button></form>
<section id="summary" class="panel" hidden><h2>Day complete</h2><div id="results" class="results"></div><button id="next" class="primary">Next day</button><button id="restart" class="quiet">New game</button></section></div>
</section><footer><button id="pause" disabled>Pause</button><button id="serve" class="primary" disabled>Make lemonade <kbd>SPACE</kbd></button><span id="progress" aria-live="polite">Click the stand or press Space</span></footer></main><script type="module" src="app.mjs"></script></body></html>
