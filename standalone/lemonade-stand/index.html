<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemonade Stand</title><meta name="description" content="A playable little 2D lemonade business."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='13' ry='10' fill='%23f9ce43'/%3E%3Cpath d='M18 7Q21 0 29 4Q26 11 18 7' fill='%234b8c50'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="https://qetuop-mini-arcade.yuanz1.chatgpt.site/games/lemonade-stand/" aria-label="Back to Mini Arcade">← Arcade</a><h1>Lemonade Stand</h1><button id="sound" aria-label="Enable sound" aria-pressed="false">Sound off</button></header>
<section class="game" aria-label="Lemonade Stand game"><div class="hud"><span id="location-name">Home</span><span>CASH <b id="cash">$20.00</b></span><span>CUPS <b id="cups">0</b></span><span id="weather">☀ 78°F</span><span id="clock">00:75</span></div>
<canvas id="scene" tabindex="0" width="960" height="600" aria-label="Street scene with a lemonade stand and customers">Your browser needs Canvas support.</canvas>
<button id="show-inventory" class="scene-hotspot" aria-label="View stand inventory" title="Inventory" hidden></button><button id="show-recipe" class="scene-hotspot" aria-label="View recipe book" title="Recipe" hidden></button><button id="map-sign" class="scene-hotspot" aria-label="Open map" hidden></button><div id="banner" class="banner" aria-live="polite">Ready to open?</div>
<div id="overlay" class="overlay" hidden><form id="setup" class="panel"><h2>Day <span id="setup-day">1</span></h2><p id="setup-location"></p><div class="forecast" id="forecast"></div><div class="forecast-next" id="tomorrow"></div><div id="supplies" class="supplies"></div><div class="recipe"><label>Lemons / cup<input id="lemons" type="number" min="1" max="3" value="1" required></label><label>Sugar / cup<input id="sugar" type="number" min="1" max="3" value="1" required></label><label>Ice / cup<input id="ice" type="number" min="1" max="3" value="1" required></label></div><div class="purchase"><label>Price / cup ($)<input id="price" type="number" min="0.25" max="5" step="0.05" value="1.50" required></label><div>Supplies cost<strong id="cost">$9.00</strong></div></div><p id="error" role="alert"></p><button class="primary" type="submit">Open stand</button><button id="back-home" class="quiet" type="button">← Home</button></form>
<section id="inventory-view" class="panel" hidden><h2>Inventory</h2><div id="inventory-details" class="results" aria-live="polite"></div><p class="inventory-capacity">Cups available <strong id="inventory-capacity"></strong></p><button id="close-inventory" class="primary">Back home</button></section><section id="map-view" class="panel map-panel" hidden><div class="map-heading"><h2>Town map</h2><span id="map-progress"></span></div><div class="world-map"><svg viewBox="0 0 960 510" preserveAspectRatio="none" aria-hidden="true"><rect width="960" height="510" rx="12" fill="#a8c88b"/><path d="M20 370Q190 290 310 330T620 430T950 350" fill="none" stroke="#87bfc4" stroke-width="45"/><path d="M150 150V355H750V220H510V125M365 355V435H750" fill="none" stroke="#edd3a2" stroke-width="30"/><path d="M150 150V355H750V220H510V125M365 355V435H750" fill="none" stroke="#c4ac82" stroke-width="2" stroke-dasharray="7 9"/><g fill="#769e61"><circle cx="480" cy="62" r="33"/><circle cx="550" cy="86" r="40"/><circle cx="435" cy="110" r="24"/><circle cx="65" cy="430" r="37"/><circle cx="895" cy="58" r="28"/></g><g fill="#ded5aa" stroke="#8e805c" stroke-width="4"><rect x="670" y="102" width="38" height="65"/><rect x="722" y="79" width="52" height="89"/><rect x="789" y="118" width="36" height="49"/></g><g fill="#d2a076" stroke="#80604a" stroke-width="3"><rect x="82" y="73" width="42" height="40"/><rect x="129" y="64" width="46" height="49"/><rect x="183" y="75" width="43" height="38"/></g><g fill="#f4cb53"><path d="M78 71H128V83H78Z"/><path d="M125 61H178V73H125Z"/><path d="M179 72H230V84H179Z"/></g><g stroke="#755d43" stroke-width="3"><path d="M696 448V478M747 448V478M799 448V478"/><path d="M672 453H720V441H672ZM723 453H771V441H723ZM775 453H823V441H775Z" fill="#b991c2"/></g><path d="M264 407H309V441H264Z" fill="#f2dfb0" stroke="#735b42" stroke-width="3"/><path d="M259 407L286 385L314 407Z" fill="#b66f51"/><text x="286" y="466" text-anchor="middle" fill="#486347" font-size="20" font-family="Trebuchet MS">Home</text></svg><div id="map-destinations"></div></div><button id="close-map" class="primary">Back home</button></section>
<section id="market-view" class="panel" hidden><h2>Market</h2><form id="market-form"><div id="market-supplies" class="supplies"></div><div class="purchase"><span>Total</span><strong id="market-cost"></strong></div><p id="market-message" role="status"></p><button class="primary" type="submit">Buy supplies</button></form><button id="market-map" class="quiet">← Map</button><button id="market-home" class="quiet">Home</button></section>
<section id="recipe-view" class="recipe-book" aria-label="Recipe book" hidden>
<button id="close-recipe" class="book-close" aria-label="Close recipe book">×</button>
<article id="book-page" class="book-leaves" aria-live="polite" aria-atomic="true">
<div class="book-leaf illustration-leaf"><span class="book-heading">Recipe book</span><h2 id="recipe-name"></h2>
<svg class="recipe-drink" viewBox="0 0 170 175" aria-hidden="true"><ellipse cx="84" cy="157" rx="48" ry="9" fill="#dac8a2"/><path d="M48 38H122L114 150H58Z" fill="#e5f1e6" stroke="#887a57" stroke-width="4"/><path d="M53 64H117L111 145H61Z" fill="#f3d45a"/><g fill="#fff7d4" stroke="#dbbf50" stroke-width="2"><rect x="64" y="75" width="20" height="18" rx="3"/><rect x="90" y="98" width="16" height="17" rx="3"/></g><path d="M104 10L90 137" stroke="#65845d" stroke-width="6"/><circle cx="50" cy="45" r="23" fill="#ffdf70" stroke="#d0a648" stroke-width="3"/><path d="M50 24V65M29 45H70M35 30L65 60M35 60L65 30" stroke="#fff4c0" stroke-width="3"/></svg>
<div class="taste-note"><strong id="recipe-flavor"></strong><span id="recipe-cooling"></span></div></div>
<div class="book-leaf ingredients-leaf"><h3>Per cup</h3><dl id="recipe-details" class="book-ingredients"></dl><h3>Taste</h3><div id="flavor-options" class="taste-options"></div><h3>Ice</h3><div id="ice-options" class="taste-options"></div></div>
</article>
<nav class="book-navigation" aria-label="Recipe pages"><button id="recipe-prev" aria-label="Previous recipe">←</button><span id="recipe-page-number"></span><button id="recipe-next" aria-label="Next recipe">→</button></nav>
</section><section id="summary" class="panel" hidden><h2>Day complete</h2><div id="results" class="results"></div><button id="next" class="primary">Next day · Home</button><button id="restart" class="quiet">New game</button></section></div>
</section><footer id="home-actions"><button id="go-stand" class="primary">Go to stand</button><span id="home-forecast"></span></footer><footer id="play-actions" hidden><button id="pause" disabled>Pause</button><button id="serve" class="primary" disabled>Make lemonade <kbd>SPACE</kbd></button><span id="progress" aria-live="polite">Click the stand or press Space</span></footer></main><script type="module" src="app.mjs"></script></body></html>
