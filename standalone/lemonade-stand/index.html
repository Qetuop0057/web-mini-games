<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemonade Stand</title><meta name="description" content="A playable little 2D lemonade business."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='13' ry='10' fill='%23f9ce43'/%3E%3Cpath d='M18 7Q21 0 29 4Q26 11 18 7' fill='%234b8c50'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="https://qetuop-mini-arcade.yuanz1.chatgpt.site/games/lemonade-stand/" aria-label="Back to Mini Arcade">← Arcade</a><h1>Lemonade Stand</h1><button id="sound" aria-label="Enable sound" aria-pressed="false">Sound off</button></header>
<section class="game" aria-label="Lemonade Stand game"><div class="hud"><span>CASH <b id="cash">$20.00</b></span><span>CUPS <b id="cups">0</b></span><span id="weather">☀ 78°F</span><span id="clock">00:75</span></div>
<canvas id="scene" tabindex="0" width="960" height="600" aria-label="Street scene with a lemonade stand and customers">Your browser needs Canvas support.</canvas>
<button id="map-sign" class="scene-hotspot" aria-label="Open map" hidden></button><div id="banner" class="banner" aria-live="polite">Ready to open?</div>
<div id="overlay" class="overlay" hidden><form id="setup" class="panel"><h2>Day <span id="setup-day">1</span></h2><div class="forecast" id="forecast"></div><div class="forecast-next" id="tomorrow"></div><div id="supplies" class="supplies"></div><div class="recipe"><label>Lemons / cup<input id="lemons" type="number" min="1" max="3" value="1" required></label><label>Sugar / cup<input id="sugar" type="number" min="1" max="3" value="1" required></label><label>Ice / cup<input id="ice" type="number" min="1" max="3" value="1" required></label></div><div class="purchase"><label>Price / cup ($)<input id="price" type="number" min="0.25" max="5" step="0.05" value="1.50" required></label><div>Supplies cost<strong id="cost">$9.00</strong></div></div><p id="error" role="alert"></p><button class="primary" type="submit">Open stand</button><button id="back-home" class="quiet" type="button">← Home</button></form>
<section id="map-view" class="panel map-panel" hidden><h2>Map</h2><svg class="town-map" viewBox="0 0 520 310" role="img" aria-label="Map of your home and street, with future park and market locations"><rect width="520" height="310" rx="10" fill="#a6c788"/><path d="M110 105V255H420V95M110 205H420" fill="none" stroke="#e7c99d" stroke-width="25"/><path d="M110 105V255H420V95M110 205H420" fill="none" stroke="#c2a77c" stroke-width="2" stroke-dasharray="6 8"/><g fill="#719859"><circle cx="280" cy="65" r="26"/><circle cx="315" cy="85" r="22"/><circle cx="270" cy="110" r="19"/><circle cx="38" cy="263" r="21"/></g><g stroke="#735b42" stroke-width="3"><rect x="80" y="67" width="60" height="43" fill="#f2dfb0"/><path d="M71 67L110 35L149 67Z" fill="#b66f51"/><rect x="103" y="85" width="14" height="25" fill="#a37a52"/><rect x="230" y="186" width="60" height="28" fill="#cc995e"/><path d="M225 171H295V186H225Z" fill="#f3cd57"/></g><g font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#344c3b"><text x="110" y="137">Home</text><text x="260" y="244">Street stand</text><text x="300" y="143">Park</text><text x="420" y="84">Market</text></g><g font-family="Trebuchet MS, sans-serif" font-size="14" text-anchor="middle" fill="#536749"><text x="300" y="163">Coming soon</text><text x="420" y="106">Coming soon</text></g><circle cx="110" cy="160" r="7" fill="#f8da69" stroke="#344c3b" stroke-width="3"/></svg><button id="close-map" class="primary">Back home</button></section><section id="recipe-view" class="panel" hidden><h2>Recipe</h2><div id="recipe-details" class="results"></div><p id="recipe-taste"></p><button id="close-recipe" class="primary">Back home</button></section><section id="summary" class="panel" hidden><h2>Day complete</h2><div id="results" class="results"></div><button id="next" class="primary">Next day · Home</button><button id="restart" class="quiet">New game</button></section></div>
</section><footer id="home-actions"><button id="go-stand" class="primary">Go to stand</button><button id="show-recipe">Recipe</button><span id="home-forecast"></span></footer><footer id="play-actions" hidden><button id="pause" disabled>Pause</button><button id="serve" class="primary" disabled>Make lemonade <kbd>SPACE</kbd></button><span id="progress" aria-live="polite">Click the stand or press Space</span></footer></main><script type="module" src="app.mjs"></script></body></html>
